apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    mavenCentral()
}
dependencies {
}

android {
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }

    namespace 'com.google.android.apps.photos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.google.android.apps.photos'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName "1.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (localProperties["RELEASE_STORE_FILE"]) storeFile file(localProperties["RELEASE_STORE_FILE"])
            storePassword localProperties["RELEASE_STORE_PASSWORD"]
            keyAlias localProperties["RELEASE_KEY_ALIAS"]
            keyPassword localProperties["RELEASE_KEY_PASSWORD"]

            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
        }
        releaseUnsigned {
            initWith release
            signingConfig null
        }
    }


}
